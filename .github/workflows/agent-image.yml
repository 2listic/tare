name: agent-image

# Builds the tare-agent image for linux/amd64 and linux/arm64 and pushes it to
# ghcr.io/2listic/tare-agent:
#   tag vX.Y.Z (tools/release.sh)   :vX.Y.Z and :latest
#   push to main touching agent/    :main and :sha-<commit>
#   pull request touching agent/    built, not pushed
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - agent/**
      - .github/workflows/agent-image.yml
  pull_request:
    paths:
      - agent/**
      - .github/workflows/agent-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/2listic/tare-agent
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
      # The version the agent reports in tare_agent_build_info: the tag for a
      # release, main-<commit> otherwise.
      - id: version
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
          *) echo "version=$GITHUB_REF_NAME-${GITHUB_SHA::7}" | tr / - >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/build-push-action@v7
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
